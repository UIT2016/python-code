[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python-code"
version = "0.1.0"
description = "Multi-app workspace: message, tool, cursor_chat"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["apps", "packages"]
include = ["cursor_chat*", "lite_agent_sdk*", "transcript_agent*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["E501"]
